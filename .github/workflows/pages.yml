name: Build MagicSchool Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get game files
        uses: actions/checkout@v4

      - name: Install Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: latest

      - name: Download raylib
        run: git clone --depth 1 https://github.com/raysan5/raylib.git

      - name: Build raylib for web
        run: |
          cd raylib/src
          emmake make PLATFORM=PLATFORM_WEB -B

      - name: Build game
        run: |
          mkdir -p dist
          emcc main.c raylib/src/libraylib.web.a \
            -Iraylib/src \
            -DPLATFORM_WEB \
            -o dist/index.html \
            -s USE_GLFW=3 \
            -s ASYNCIFY \
            -s ALLOW_MEMORY_GROWTH=1 \
            --preload-file bgm.ogg \
            --preload-file scare.wav \
            --preload-file blanket.wav \
            --preload-file drawer.wav \
            --preload-file rug.wav

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload web game
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publish game
        id: deployment
        uses: actions/deploy-pages@v4
